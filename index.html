<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090413">
  <title>UnLoadSMP — Правила</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var lite =
          window.matchMedia('(hover: none), (pointer: coarse)').matches ||
          window.innerWidth <= 900 ||
          (navigator.hardwareConcurrency || 4) <= 4 ||
          (navigator.deviceMemory || 4) <= 4;

        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (lite) document.documentElement.classList.add('lite');
        if (reduced) document.documentElement.classList.add('reduced');
      } catch (e) {
        if (window.innerWidth <= 900) document.documentElement.classList.add('lite');
      }
    })();
  </script>

  <style>
    :root{
      --bg:#090413;
      --text:#fff7ff;
      --muted:#c8b6e4;
      --border:rgba(255,255,255,.10);
      --glass:rgba(255,255,255,.055);
      --purple:#a855f7;
      --violet:#7c3aed;
      --pink:#ec4899;
      --rose:#fb7185;
      --cyan:#22d3ee;
      --radius:26px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{
      margin:0;
      min-height:100vh;
      font-family:Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(168,85,247,.26), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(236,72,153,.22), transparent 24%),
        radial-gradient(circle at 50% 92%, rgba(124,58,237,.18), transparent 30%),
        var(--bg);
      overflow-x:hidden;
      -webkit-tap-highlight-color:transparent;
    }

    body::after{
      content:"";
      position:fixed;
      inset:-40%;
      z-index:-3;
      pointer-events:none;
      background:conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(168,85,247,.10) 12%,
        transparent 25%,
        rgba(236,72,153,.10) 42%,
        transparent 58%,
        rgba(34,211,238,.07) 74%,
        transparent 100%
      );
      animation:slowSpin 34s linear infinite;
      filter:blur(20px);
      opacity:.72;
    }

    @keyframes slowSpin{to{transform:rotate(360deg)}}

    a{color:inherit;text-decoration:none}
    button,input{font:inherit;color:inherit}
    button{border:0;background:none;cursor:pointer;touch-action:manipulation}

    #fx{position:fixed;inset:0;z-index:-2;pointer-events:none}
    #floaters{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(38px);
      opacity:.24;
      animation:drift var(--dur) ease-in-out infinite alternate;
    }

    .diamond{
      position:absolute;
      border:1px solid rgba(255,255,255,.16);
      background:linear-gradient(135deg, rgba(168,85,247,.22), rgba(236,72,153,.12));
      transform:rotate(45deg);
      animation:spinFloat var(--dur) linear infinite;
      opacity:.5;
      box-shadow:0 0 24px rgba(168,85,247,.12);
    }

    @keyframes drift{
      0%{transform:translate3d(0,0,0) scale(1)}
      100%{transform:translate3d(var(--dx), var(--dy), 0) scale(1.18)}
    }

    @keyframes spinFloat{
      0%{transform:rotate(45deg) translateY(0)}
      50%{transform:rotate(180deg) translateY(-30px)}
      100%{transform:rotate(405deg) translateY(0)}
    }

    .container{
      width:min(1120px, calc(100% - 24px));
      margin:0 auto;
    }

    .page{
      position:relative;
      z-index:1;
      padding-bottom:calc(80px + env(safe-area-inset-bottom));
    }

    .hero{
      min-height:100vh;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:calc(70px + env(safe-area-inset-top)) 0 34px;
      text-align:center;
    }

    .staff-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 15px;
      border-radius:999px;
      border:1px solid rgba(236,72,153,.28);
      background:linear-gradient(135deg, rgba(168,85,247,.16), rgba(236,72,153,.12));
      color:#ffd6f2;
      font-size:clamp(10px, 2.8vw, 12px);
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      box-shadow:0 14px 40px rgba(0,0,0,.20);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .title{
      margin:20px 0 12px;
      font-family:Unbounded, sans-serif;
      font-size:clamp(38px, 11vw, 104px);
      line-height:.9;
      letter-spacing:-.06em;
      color:transparent;
      background:linear-gradient(
        110deg,
        #fff 0%,
        #f5d0fe 18%,
        #c084fc 34%,
        #f472b6 52%,
        #a855f7 70%,
        #fff 100%
      );
      background-size:300% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      animation:titleShine 7s linear infinite;
      filter:drop-shadow(0 12px 30px rgba(168,85,247,.18));
      word-break:break-word;
    }

    @keyframes titleShine{
      0%{background-position:0% 50%}
      100%{background-position:300% 50%}
    }

    .subtitle{
      max-width:760px;
      margin:0 auto;
      color:#e5d7ff;
      font-size:clamp(14px, 3.8vw, 20px);
      line-height:1.55;
      font-weight:700;
      text-shadow:0 4px 24px rgba(0,0,0,.18);
    }

    .ip-line{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:20px;
      color:var(--muted);
      font-weight:800;
      font-size:clamp(12px, 3.2vw, 14px);
    }

    .ip-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:46px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#fff;
      font-weight:900;
      font-size:clamp(12px, 3.2vw, 14px);
      box-shadow:0 12px 30px rgba(0,0,0,.16);
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
      will-change:transform;
    }

    .ip-btn:active{transform:scale(.97)}

    .socials{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
      gap:12px;
      margin:26px auto 0;
      max-width:1000px;
      text-align:left;
    }

    .social-btn{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:66px;
      padding:14px 15px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)),
        radial-gradient(circle at top left, rgba(168,85,247,.16), transparent 45%);
      box-shadow:0 18px 45px rgba(0,0,0,.20);
      overflow:hidden;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      will-change:transform;
    }

    .social-btn::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(
        130deg,
        transparent 20%,
        rgba(168,85,247,.65),
        rgba(236,72,153,.65),
        transparent 80%
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      opacity:0;
      transition:opacity .2s ease;
      pointer-events:none;
    }

    .social-btn:active{transform:scale(.98)}

    .social-icon{
      width:48px;
      height:48px;
      border-radius:17px;
      display:grid;
      place-items:center;
      color:#fff;
      flex:0 0 auto;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 10px 24px rgba(0,0,0,.18);
    }

    .social-icon svg{
      width:25px;
      height:25px;
      display:block;
    }

    .vk .social-icon{background:linear-gradient(135deg,#6d28d9,#22d3ee)}
    .discord .social-icon{background:linear-gradient(135deg,#7c3aed,#ec4899)}
    .tg .social-icon{background:linear-gradient(135deg,#a855f7,#f472b6)}
    .support .social-icon{background:linear-gradient(135deg,#d946ef,#fb7185)}
    .bot .social-icon{background:linear-gradient(135deg,#8b5cf6,#22d3ee)}

    .social-meta{min-width:0}
    .social-meta strong{
      display:block;
      font-size:clamp(13px, 3.4vw, 15px);
      font-weight:900;
      letter-spacing:-.01em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .social-meta small{
      display:block;
      margin-top:2px;
      color:var(--muted);
      font-size:clamp(11px, 3vw, 12px);
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .social-arrow{
      margin-left:auto;
      color:var(--muted);
      flex:0 0 auto;
      transition:transform .2s ease, color .2s ease;
    }

    .search-shell{
      display:flex;
      align-items:center;
      gap:10px;
      width:min(680px, 100%);
      margin:20px auto 0;
      padding:0 14px;
      height:52px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.055);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 16px 40px rgba(0,0,0,.16);
      transition:border-color .2s ease, box-shadow .2s ease;
    }

    .search-shell:focus-within{
      border-color:rgba(236,72,153,.38);
      box-shadow:0 0 0 4px rgba(236,72,153,.08), 0 18px 45px rgba(0,0,0,.18);
    }

    .search-shell input{
      flex:1;
      min-width:0;
      border:0;
      outline:none;
      background:transparent;
      font-weight:700;
      font-size:15px;
    }

    .search-shell input::placeholder{color:#a08fbd}

    .codex{padding:8px 0 18px}

    .section-card{
      position:relative;
      margin:18px 0;
      padding:22px;
      border-radius:var(--radius);
      border:1px solid rgba(255,255,255,.09);
      background:
        linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.025)),
        radial-gradient(circle at top left, rgba(168,85,247,.12), transparent 38%),
        radial-gradient(circle at bottom right, rgba(236,72,153,.10), transparent 35%);
      box-shadow:0 20px 60px rgba(0,0,0,.18);
      overflow:hidden;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      content-visibility:auto;
      contain-intrinsic-size:auto 520px;
    }

    .section-card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(
        135deg,
        rgba(168,85,247,.55),
        rgba(236,72,153,.38),
        rgba(34,211,238,.22),
        rgba(168,85,247,.55)
      );
      background-size:300% 300%;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      animation:borderShine 9s linear infinite;
      pointer-events:none;
      opacity:.62;
    }

    @keyframes borderShine{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    .section-card.hide{display:none}

    .section-top{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .section-glyph{
      width:46px;
      height:46px;
      border-radius:17px;
      display:grid;
      place-items:center;
      color:#fbc6ff;
      background:linear-gradient(135deg, rgba(168,85,247,.18), rgba(236,72,153,.12));
      border:1px solid rgba(236,72,153,.18);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
      flex:0 0 auto;
    }

    .section-glyph svg{width:23px;height:23px;display:block}

    .section-title{
      margin:0;
      font-family:Unbounded, sans-serif;
      font-size:clamp(17px, 4.8vw, 27px);
      line-height:1.1;
      font-weight:900;
      letter-spacing:-.035em;
      color:#fff;
      text-shadow:0 8px 24px rgba(0,0,0,.16);
    }

    .section-intro{
      margin:0 0 14px;
      color:#dccdf2;
      line-height:1.6;
      font-weight:600;
      font-size:clamp(13px, 3.5vw, 15px);
    }

    .rules-list{display:grid;gap:12px}

    .rule{
      position:relative;
      padding:16px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.035);
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .rule:active{transform:scale(.99)}
    .rule.hide{display:none}

    .rule-head{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .rule-code{
      padding:6px 10px;
      border-radius:999px;
      background:linear-gradient(135deg, rgba(168,85,247,.18), rgba(236,72,153,.14));
      border:1px solid rgba(236,72,153,.18);
      color:#ffd6f5;
      font-size:12px;
      font-weight:900;
      letter-spacing:.02em;
    }

    .rule h3{
      margin:0;
      font-size:clamp(15px, 4vw, 18px);
      line-height:1.25;
      font-weight:900;
      letter-spacing:-.02em;
      color:#fff;
    }

    .rule-body p{
      margin:8px 0;
      color:#d9cced;
      line-height:1.6;
      font-size:clamp(13px, 3.5vw, 15px);
    }

    .rule-body ul{
      margin:8px 0 0 18px;
      color:#d9cced;
      line-height:1.55;
      font-size:clamp(13px, 3.5vw, 15px);
    }

    .rule-body li{margin:4px 0}

    .verdict{
      margin-top:12px;
      padding:12px 14px;
      border-radius:16px;
      background:linear-gradient(90deg, rgba(236,72,153,.14), rgba(251,113,133,.10), rgba(168,85,247,.08));
      border:1px solid rgba(236,72,153,.20);
    }

    .verdict-head{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:7px;
      color:#ffd0e8;
      font-weight:900;
      letter-spacing:-.01em;
      font-size:14px;
    }

    .verdict ul{
      margin:0 0 0 18px;
      color:#ffe1f1;
      font-size:clamp(13px, 3.5vw, 14px);
    }

    .note{
      display:flex;
      align-items:flex-start;
      gap:10px;
      margin:10px 0;
      padding:12px 14px;
      border-radius:15px;
      background:linear-gradient(90deg, rgba(34,211,238,.10), rgba(168,85,247,.08));
      border-left:3px solid var(--cyan);
      color:#d8f7ff;
      line-height:1.5;
      font-size:clamp(12px, 3.3vw, 14px);
    }

    .ic{
      display:inline-grid;
      place-items:center;
      width:1.25em;
      height:1.25em;
      flex:0 0 auto;
    }

    .ic svg{width:100%;height:100%;display:block}

    .empty{
      display:none;
      text-align:center;
      padding:50px 18px;
      color:var(--muted);
      font-size:16px;
      font-weight:800;
    }

    .footer{padding:8px 0 0}

    .footer-card{
      position:relative;
      text-align:center;
      padding:24px 18px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.09);
      background:
        linear-gradient(135deg, rgba(168,85,247,.14), rgba(236,72,153,.10), rgba(34,211,238,.07)),
        rgba(255,255,255,.03);
      box-shadow:0 18px 50px rgba(0,0,0,.18);
      overflow:hidden;
    }

    .footer-card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(135deg, rgba(168,85,247,.55), rgba(236,72,153,.45), transparent);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      pointer-events:none;
      opacity:.6;
    }

    .footer-card b{
      display:block;
      font-family:Unbounded, sans-serif;
      font-size:clamp(16px, 5vw, 26px);
      letter-spacing:-.03em;
      color:#fff;
    }

    .footer-card p{
      margin:8px 0 0;
      color:#dbcdf0;
      font-weight:700;
      font-size:clamp(12px, 3.4vw, 14px);
    }

    .reveal{
      opacity:0;
      transform:translateY(24px) scale(.985);
      transition:opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1);
      will-change:transform, opacity;
    }

    .reveal.in{opacity:1;transform:none}

    #toast{
      position:fixed;
      left:50%;
      bottom:calc(22px + env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(20px);
      opacity:0;
      pointer-events:none;
      z-index:100;
      max-width:calc(100% - 28px);
      padding:11px 16px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(18,8,28,.94);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      color:#fff;
      font-weight:900;
      font-size:13px;
      text-align:center;
      box-shadow:0 18px 45px rgba(0,0,0,.30);
      transition:opacity .22s ease, transform .22s ease;
    }

    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media (hover:hover) and (pointer:fine){
      .ip-btn:hover{
        transform:translateY(-2px);
        border-color:rgba(236,72,153,.38);
        background:rgba(236,72,153,.10);
      }
      .social-btn:hover{
        transform:translateY(-3px);
        border-color:rgba(255,255,255,.16);
        box-shadow:0 24px 60px rgba(0,0,0,.28);
      }
      .social-btn:hover::after{opacity:1}
      .social-btn:hover .social-arrow{transform:translateX(4px);color:#fff}
      .rule:hover{
        transform:translateY(-2px);
        border-color:rgba(236,72,153,.20);
        background:rgba(255,255,255,.05);
      }
    }

    html.lite body::after{display:none}
    html.lite .orb{filter:blur(18px);opacity:.12}
    html.lite .diamond{display:none}
    html.lite .title{animation:none}
    html.lite .staff-badge,
    html.lite .search-shell,
    html.lite .social-btn,
    html.lite .section-card{
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
    }
    html.lite .section-card::before{display:none}
    html.lite .section-card{
      border-color:rgba(168,85,247,.18);
      box-shadow:0 10px 28px rgba(0,0,0,.16);
    }
    html.lite .social-btn{box-shadow:0 10px 24px rgba(0,0,0,.16)}
    html.lite .reveal{transition-duration:.28s}
    html.lite #fx{opacity:.55}

    html.reduced *,
    html.reduced *::before,
    html.reduced *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }

    html.reduced .reveal{opacity:1;transform:none}

    @media (max-width: 860px){
      .hero{
        min-height:auto;
        padding:calc(82px + env(safe-area-inset-top)) 0 28px;
      }
      .socials{
        grid-template-columns:1fr 1fr;
        gap:10px;
      }
      .search-shell{
        position:sticky;
        top:10px;
        z-index:30;
        background:rgba(18,8,28,.78);
      }
    }

    @media (max-width: 620px){
      .container{width:min(1120px, calc(100% - 20px))}
      .socials{grid-template-columns:1fr}
      .social-btn{padding:13px 14px;min-height:62px}
      .social-icon{width:44px;height:44px;border-radius:15px}
      .social-icon svg{width:23px;height:23px}
      .section-card{padding:16px;border-radius:22px}
      .section-top{gap:10px}
      .section-glyph{width:42px;height:42px;border-radius:15px}
      .rule{padding:14px;border-radius:18px}
      .verdict{padding:11px 12px}
      .note{padding:11px 12px}
      .footer-card{padding:20px 14px}
    }

    @media (max-width: 380px){
      .staff-badge{padding:9px 12px;gap:8px}
      .title{font-size:clamp(32px, 13vw, 54px)}
      .ip-btn{width:100%;justify-content:center}
      .ip-line{width:100%}
      .search-shell{height:50px;padding:0 12px}
      .rule-head{gap:8px}
      .rule-code{font-size:11px;padding:5px 9px}
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="floaters"></div>
  <div id="root"></div>
  <div id="toast"></div>

  <script>
    const SOCIAL = {
      vk: "https://vk.com/unloadsmp",
      discord: "https://discord.gg/k5zzWEqaRr",
      telegram: "https://t.me/UnLoadSMP",
      support: "https://t.me/UnLoadSMPs",
      bot: "https://t.me/UnLoadSMP_bot"
    };

              "имитацию элементов кастомизации персонала."
            ])}${verdict([
              "первое нарушение — бан 3 часа с требованием исправить нарушение;",
              "повторное нарушение — бан 12 часов."
            ])}`
          },
          {
            code: "3.3.3",
            title: "Недопустимые постройки",
            body: `<p>Запрещено создавать постройки, картины и другие объекты, которые:</p>${list([
              "пропагандируют нацизм;",
              "содержат сцены насилия;",
              "содержат порнографию;",
              "содержат оскорбления."
            ])}${note("Если постройка существовала более 150 часов и не была замечена ранее, наказание может не применяться, однако постройка подлежит обязательному сносу.")}${verdict(["бан 8 часов и принудительный снос постройки."])}`
          },
          {
            code: "3.4.1",
            title: "Некорректное наказание",
            body: `<p>Нарушением считается выдача наказания:</p>${list([
              "не предусмотренного Правилами;",
              "с неправильным сроком;",
              "за нарушение, которое уже было пресечено и наказано."
            ])}${verdict([
              "бан 8 часов.",
              "При 7 и более нарушениях — бан 30 дней с конфискацией привилегий."
            ])}`
          },
          {
            code: "3.4.2",
            title: "Отсутствие доказательств",
            body: `<p>Запрещено выдавать наказание без достаточных доказательств: скриншотов, видео, логов или иных подтверждений.</p>${verdict([
              "бан 1 день.",
              "При 7 и более нарушениях — бан 30 дней с конфискацией привилегий."
            ])}`
          },
          {
            code: "3.4.3",
            title: "Злоупотребление полномочиями",
            body: `<p>Запрещено использовать оскорбительные, унизительные или неадекватные причины наказания.</p>${verdict([
              "бан 2 дня.",
              "При 3 и более нарушениях — бан 30 дней с конфискацией привилегий."
            ])}`
          },
          {
            code: "3.4.4",
            title: "Самовольное снятие наказания",
            body: `<p>Запрещено самостоятельно снимать блокировку, наложенную другим сотрудником Проекта.</p>${verdict([
              "бан 1 день.",
              "При 7 и более нарушениях — бан 30 дней с конфискацией привилегий."
            ])}`
          },
          {
            code: "3.5.1",
            title: "Вмешательство в работу персонала",
            body: `<p>Запрещается:</p>${list([
              "выдавать себя за сотрудника;",
              "без разрешения вызывать игроков на проверку;",
              "вмешиваться в работу Администрации."
            ])}${verdict(["бан 2 дня."])}`
          },
          {
            code: "3.5.2",
            title: "Вред Проекту",
            body: `<p>Запрещены:</p>${list([
              "намеренная порча спавнов;",
              "создание лагов;",
              "использование багов;",
              "взлом аккаунтов;",
              "подделка доказательств."
            ])}${verdict([
              "бессрочная блокировка аккаунта;",
              "IP-блокировка на 90 дней;",
              "снятие привилегий."
            ])}`
          },
          {
            code: "3.5.3",
            title: "Деанонимизация (доксинг)",
            body: `<p>Запрещено распространять личную информацию игроков без их согласия, включая ФИО, адрес, номер телефона и другие персональные данные.</p>${verdict([
              "бессрочная блокировка аккаунта;",
              "IP-блокировка на 90 дней;",
              "снятие привилегий."
            ])}`
          },
          {
            code: "3.5.4",
            title: "Торговля за реальные деньги",
            body: `<p>Запрещены сделки по продаже или обмену игровых ценностей за реальные деньги.</p>${verdict([
              "бессрочная блокировка аккаунта;",
              "IP-блокировка на 90 дней;",
              "снятие привилегий."
            ])}`
          }
        ]
      }
    ];

    const root = document.getElementById("root");

    const socialsData = [
      { name: "ВКонтакте", sub: "Сообщество проекта", cls: "vk", icon: "vk", url: SOCIAL.vk },
      { name: "Discord", sub: "Голос и общение", cls: "discord", icon: "discord", url: SOCIAL.discord },
      { name: "Telegram-канал", sub: "Новости проекта", cls: "tg", icon: "telegram", url: SOCIAL.telegram },
      { name: "Тех. поддержка", sub: "@UnLoadSMPs", cls: "support", icon: "support", url: SOCIAL.support },
      { name: "Бот привязки", sub: "@UnLoadSMP_bot", cls: "bot", icon: "bot", url: SOCIAL.bot }
    ];

    root.innerHTML = `
      <main class="page">
        <section class="hero">
          <div class="container">
            <div class="staff-badge">${icon("lock")} Правила проекта</div>

            <h1 class="title">UnLoadSMP</h1>

            <p class="subtitle">
              Официальный свод правил UnLoadSMP. Ознакомление обязательно. Незнание правил не освобождает от ответственности.
            </p>

            <div class="ip-line">
              <span>IP сервера:</span>
              <button class="ip-btn" id="copyIp">
                ${icon("copy")}
                <span>${SERVER_IP}</span>
              </button>
            </div>

            <div class="socials">
              ${socialsData.map(s => `
                <a class="social-btn ${s.cls}" href="${s.url}" target="_blank" rel="noopener noreferrer">
                  <span class="social-icon">${ICONS[s.icon]}</span>
                  <span class="social-meta">
                    <strong>${s.name}</strong>
                    <small>${s.sub}</small>
                  </span>
                  <span class="social-arrow">${ICONS.arrow}</span>
                </a>
              `).join("")}
            </div>

            <label class="search-shell">
              ${icon("search")}
              <input id="search" type="search" placeholder="Поиск: читы, мат, реклама, грифер...">
            </label>
          </div>
        </section>

        <section class="codex container" id="rules">
          ${DATA.map(section => `
            <article class="section-card reveal">
              <div class="section-top">
                <span class="section-glyph">${ICONS.shield}</span>
                <h2 class="section-title">${section.title}</h2>
              </div>

              ${section.intro ? `<div class="section-intro">${section.intro}</div>` : ""}

              <div class="rules-list">
                ${section.rules.map(rule => `
                  <div class="rule reveal">
                    <div class="rule-head">
                      <span class="rule-code">${rule.code}</span>
                      <h3>${rule.title}</h3>
                    </div>
                    <div class="rule-body">${rule.body}</div>
                  </div>
                `).join("")}
              </div>
            </article>
          `).join("")}
        </section>

        <div class="empty container" id="empty">
          Ничего не найдено. Попробуй другой запрос.
        </div>

        <footer class="container footer">
          <div class="footer-card reveal">
            <b>UnLoadSMP • Правила сервера</b>
            <p>Играйте честно. Соблюдайте правила. Уважайте других.</p>
          </div>
        </footer>
      </main>
    `;

    const isLite = document.documentElement.classList.contains('lite');
    const isReduced = document.documentElement.classList.contains('reduced');

    if (isReduced) {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
    } else {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: isLite ? 0.02 : 0.08,
        rootMargin: isLite ? '120px 0px' : '0px'
      });

      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    if (!isLite && !isReduced) {
      document.querySelectorAll('.social-btn, .ip-btn').forEach(el => {
        el.addEventListener('mousemove', e => {
          const r = el.getBoundingClientRect();
          const x = (e.clientX - r.left - r.width / 2) / r.width;
          const y = (e.clientY - r.top - r.height / 2) / r.height;

          if (el.classList.contains('social-btn')) {
            el.style.transform = `perspective(760px) rotateX(${-y * 7}deg) rotateY(${x * 9}deg) translate(${x * 7}px, ${y * 7}px)`;
          } else {
            el.style.transform = `translate(${x * 7}px, ${y * 7}px)`;
          }
        });

        el.addEventListener('mouseleave', () => {
          el.style.transform = '';
        });
      });
    }

    const searchInput = document.getElementById('search');
    const empty = document.getElementById('empty');

    const ruleItems = [...document.querySelectorAll('.rule')].map(el => ({
      el,
      text: (el.textContent || '').toLowerCase()
    }));

    const sectionItems = [...document.querySelectorAll('.section-card')].map(el => ({
      el,
      rules: [...el.querySelectorAll('.rule')]
    }));

    function applySearch() {
      const q = searchInput.value.trim().toLowerCase();
      let visible = 0;

      ruleItems.forEach(item => {
        const match = !q || item.text.includes(q);
        item.el.classList.toggle('hide', !match);
        if (match) visible++;
      });

      sectionItems.forEach(section => {
        const hasVisible = section.rules.some(rule => !rule.classList.contains('hide'));
        section.el.classList.toggle('hide', Boolean(q) && !hasVisible);
      });

      empty.style.display = q && visible === 0 ? 'block' : 'none';
    }

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applySearch, isLite ? 180 : 90);
    });

    applySearch();

    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch {}

      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();

      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch {}
      ta.remove();
      return ok;
    }

    document.getElementById('copyIp').addEventListener('click', async () => {
      const ok = await copyText(SERVER_IP);
      showToast(ok ? `IP скопирован: ${SERVER_IP}` : `IP сервера: ${SERVER_IP}`);
    });

    (function initFloaters() {
      if (isReduced) return;

      const holder = document.getElementById('floaters');
      const colors = [
        'rgba(168,85,247,.55)',
        'rgba(236,72,153,.45)',
        'rgba(124,58,237,.42)',
        'rgba(34,211,238,.22)'
      ];

      const orbCount = isLite ? 5 : 14;
      const diamondCount = isLite ? 0 : 12;

      for (let i = 0; i < orbCount; i++) {
        const orb = document.createElement('div');
        orb.className = 'orb';
        const size = (isLite ? 70 : 90) + Math.random() * (isLite ? 120 : 220);
        orb.style.width = `${size}px`;
        orb.style.height = `${size}px`;
        orb.style.left = `${Math.random() * 100}%`;
        orb.style.top = `${Math.random() * 100}%`;
        orb.style.background = colors[Math.floor(Math.random() * colors.length)];
        orb.style.setProperty('--dx', `${(Math.random() - 0.5) * (isLite ? 80 : 170)}px`);
        orb.style.setProperty('--dy', `${(Math.random() - 0.5) * (isLite ? 80 : 170)}px`);
        orb.style.setProperty('--dur', `${12 + Math.random() * 18}s`);
        holder.appendChild(orb);
      }

      for (let i = 0; i < diamondCount; i++) {
        const d = document.createElement('div');
        d.className = 'diamond';
        const size = 12 + Math.random() * 28;
        d.style.width = `${size}px`;
        d.style.height = `${size}px`;
        d.style.left = `${Math.random() * 100}%`;
        d.style.top = `${Math.random() * 100}%`;
        d.style.setProperty('--dur', `${10 + Math.random() * 16}s`);
        holder.appendChild(d);
      }
    })();

    (function initCanvas() {
      const canvas = document.getElementById('fx');
      if (!canvas || isReduced) return;

      const ctx = canvas.getContext('2d', { alpha: true });
      const colors = ['#a855f7', '#ec4899', '#8b5cf6', '#f472b6', '#22d3ee'];

      let w = 0;
      let h = 0;
      let particles = [];
      let raf = 0;
      let last = 0;

      const fps = isLite ? 30 : 60;
      const interval = 1000 / fps;
      const drawLinks = !isLite;
      const mouse = { x: null, y: null, r: 130 };

      function makeParticles() {
        const base = isLite
          ? Math.min(22, Math.floor(w / 45))
          : Math.min(95, Math.floor(w / 14));

        particles = Array.from({ length: base }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * (isLite ? 0.18 : 0.32),
          vy: (Math.random() - 0.5) * (isLite ? 0.18 : 0.32),
          r: Math.random() * (isLite ? 1.5 : 2.1) + 0.7,
          c: colors[Math.floor(Math.random() * colors.length)]
        }));
      }

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        makeParticles();
      }

      window.addEventListener('resize', resize, { passive: true });

      if (!isLite) {
        window.addEventListener('mousemove', e => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        }, { passive: true });

        window.addEventListener('mouseout', () => {
          mouse.x = null;
          mouse.y = null;
        }, { passive: true });
      }

      function render(ts) {
        if (!last) last = ts;
        if (ts - last < interval) {
          raf = requestAnimationFrame(render);
          return;
        }
        last = ts;

        ctx.clearRect(0, 0, w, h);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;

          if (!isLite && mouse.x !== null && mouse.y !== null) {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 0 && dist < mouse.r) {
              const force = (mouse.r - dist) / mouse.r * 0.75;
              p.x += (dx / dist) * force;
              p.y += (dy / dist) * force;
            }
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.c;
          ctx.globalAlpha = 0.7;
          ctx.fill();

          if (drawLinks) {
            for (let j = i + 1; j < particles.length; j++) {
              const q = particles[j];
              const dx = p.x - q.x;
              const dy = p.y - q.y;
              const dist = Math.hypot(dx, dy);

              if (dist < 125) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.strokeStyle = p.c;
                ctx.globalAlpha = (1 - dist / 125) * 0.16;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }
        }

        ctx.globalAlpha = 1;
        raf = requestAnimationFrame(render);
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(raf);
        } else {
          last = 0;
          raf = requestAnimationFrame(render);
        }
      });

      resize();
      raf = requestAnimationFrame(render);
    })();
  </script>
